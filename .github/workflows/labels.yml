name: Sync labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If 'true', print what would change without writing."
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          dry-run: ${{ inputs.dry_run }}
